[project]
name = "lilyvae"
version = "0.1.0"
description = "Variational autoencoder for LILY database ocean crust borehole data"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "numpy",
    "pandas",
    "scikit-learn",
    "catboost",
    "umap-learn",
    "matplotlib",
    "cartopy",
    "requests",
    "tqdm",
    "joblib",
    "seaborn>=0.13.2",
    "pytorch-tabnet>=4.0",
]

[project.scripts]
lilyvae-download = "lilyvae.scripts.download:main"
lilyvae-pipeline = "lilyvae.scripts.pipeline:main"
lilyvae-train = "lilyvae.scripts.train:main"
lilyvae-bootstrap = "lilyvae.scripts.bootstrap:main"
lilyvae-evaluate = "lilyvae.scripts.evaluate:main"
lilyvae-zeroshot = "lilyvae.scripts.zeroshot:main"
lilyvae-plot = "lilyvae.scripts.plot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lilyvae"]

# On Linux workstations (lambda-scalar), install the CUDA 12.8 build of torch.
# macOS development machines use the default PyPI wheel, which has MPS support.
# The workstation driver (570.207) supports up to CUDA 12.8, so the 13.0
# wheel that PyPI ships by default will fail with "driver too old".
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
