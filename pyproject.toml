[project]
name = "lilyvae"
version = "0.1.0"
description = "Variational autoencoder for LILY database ocean crust borehole data"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "numpy",
    "pandas",
    "scikit-learn",
    "catboost",
    "umap-learn",
    "matplotlib",
    "cartopy",
    "requests",
    "tqdm",
    "joblib",
    "seaborn>=0.13.2",
    "pytorch-tabnet>=4.0",
]

[project.scripts]
lilyvae-download = "lilyvae.scripts.download:main"
lilyvae-train = "lilyvae.scripts.train:main"
lilyvae-evaluate = "lilyvae.scripts.evaluate:main"
lilyvae-bootstrap = "lilyvae.scripts.bootstrap:main"
lilyvae-zeroshot = "lilyvae.scripts.zeroshot:main"
lilyvae-plot = "lilyvae.scripts.plot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lilyvae"]
