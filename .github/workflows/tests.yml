name: tests

on:
  push:
    branches: [main, cleanup, jgr-ml]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra test

      - name: Run tests
        run: uv run pytest tests/ -v -m "not slow"

  paper-build:
    # The NeurIPS submission went out with 18 escaped \\citep, which
    # pdflatex reports no error for. Two reviewers flagged the result.
    # This job is the check that would have caught it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended \
            texlive-bibtex-extra texlive-science

      - name: Build the manuscript and check citations
        run: bash scripts/check_paper_build.sh jgr_ml
